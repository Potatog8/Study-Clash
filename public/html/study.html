<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Study Clash | Study</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/styles/navbar.css">
  <link rel="stylesheet" href="/styles/study.css">
  <link rel="stylesheet" href="/styles/addFriend.css">
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">
    <a class="header-brand" href="/leaderboard" aria-label="Study Clash home">
      <img src="/images/logostudy.png" alt="Study Clash Logo" class="site-logo">
      <span class="brand-name">Study Clash</span>
    </a>

    <div class="header-user">
      <button type="button" class="header-friend" id="add-friend-btn">Add friend</button>
      <a class="header-login" id="logout-btn" href="/login">Log out</a>
    </div>
  </header>

  <!-- PAGE CONTENT -->
  <main class="page-content study-page">
    <section class="timer-card" aria-labelledby="study-title">
      <h1 id="study-title">Study</h1>

      <!-- Static for now; JavaScript can update this text later -->
      <p class="timer-display" id="timer" role="timer" aria-live="off">00:00:00</p>
      <p class="timer-status" id="status">Ready to study</p>

      <div class="timer-controls">
        <button type="button" class="study-btn study-btn-start" id="start-btn">Start</button>

        <div class="timer-secondary">
          <button type="button" class="study-btn study-btn-secondary" id="pause-btn">Pause</button>
          <button type="button" class="study-btn study-btn-secondary" id="stop-btn">End Session</button>
        </div>
      </div>

    </section>
    <section class="results-card" id="results-card" aria-live="polite" hidden>
      <h2 class="results-title reveal" id="result-message"></h2>

      <p class="results-line reveal" id="result-time"></p>

      <p class="results-line reveal" id="result-points-line">
        You gained <span id="result-points">0</span> points!
        (<span id="result-streak">1</span> day streak)
      </p>

      <p class="results-total reveal" id="result-total-line">
        Total Points: <span id="result-total">0</span>
      </p>

      <div class="results-actions reveal" id="result-actions">
        <a class="study-btn study-btn-secondary results-btn" href="/leaderboard">View Leaderboards</a>
        <button type="button" class="study-btn results-btn results-btn-primary" id="keep-studying-btn">Keep
          Studying</button>
      </div>
    </section>
  </main>

  <!-- BOTTOM NAVBAR -->
  <nav class="bottom-nav" aria-label="Main navigation">

    <a class="nav-item" href="/leaderboard">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z" />
        <path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3" />
      </svg>
      <span class="nav-label">Leaderboard</span>
    </a>

    <a class="nav-item nav-play" href="#" aria-current="page">
      <span class="play-circle">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 5v14l11-7z" />
        </svg>
      </span>
    </a>

    <a class="nav-item" href="/profile">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21a8 8 0 0 1 16 0" />
      </svg>
      <span class="nav-label">Profile</span>
    </a>

  </nav>

  <!-- ADD FRIEND POPUP -->
  <dialog class="friend-dialog" id="friend-dialog" aria-labelledby="friend-dialog-title">
    <form class="friend-form" id="friend-form">
      <button type="button" class="friend-close" id="friend-close" aria-label="Close">&times;</button>

      <h2 id="friend-dialog-title">Add a friend</h2>
      <p class="friend-hint">Enter their 5-character friend code (letters and numbers only).</p>

      <div class="field">
        <label for="friend-code">Friend code</label>
        <input type="text" id="friend-code" class="friend-code-input" name="code" placeholder="A1B2C"
          autocomplete="off" autocapitalize="characters" spellcheck="false" autofocus>
      </div>

      <p class="friend-error" id="friend-error" role="alert"></p>

      <button type="submit" class="friend-submit">Add Friend</button>
    </form>
  </dialog>

  <script type="module" src="/js/addFriend.js"></script>
  <script type="module" src="/js/study.js"></script>


</body>

</html>
