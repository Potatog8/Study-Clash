<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Study Clash | Profile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap"
    rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">

  <!-- Navbar CSS -->
  <link rel="stylesheet" href="/styles/navbar.css">

  <!-- Profile CSS -->
  <link rel="stylesheet" href="/styles/profile.css">

  <!-- Add friend CSS -->
  <link rel="stylesheet" href="/styles/addFriend.css">
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">

    <a class="header-brand" href="/leaderboard" aria-label="Study Clash home">
      <img src="/images/logostudy.png" alt="Study Clash Logo" class="site-logo">
      <span class="brand-name">Study Clash</span>
    </a>

    <div class="header-user">
      <button type="button" class="header-friend" id="add-friend-btn">Add friend</button>
      <a class="header-login" href="/login">Log in</a>
    </div>

  </header>


  <!-- PAGE CONTENT -->
  <main class="page-content container py-4">

    <!-- PROFILE PICTURE AND NAME -->
    <section class="text-center mb-4">

      <img
        id="profile-avatar"
        src="/images/cat.png"
        alt="Profile Avatar"
        class="profile-picture rounded-circle mx-auto d-block mb-3">

      <h2 id="username">Loading...</h2>

      <p class="profile-friend-code">Friend code: <span id="profile-friend-code">---</span></p>

    </section>


    <!-- STUDY STATISTICS -->
    <section class="row g-3 mb-5">


      <!-- THIS WEEK -->
      <div class="col-6">
        <div class="stat-card text-center p-3 rounded-3">
          <h3 id="weekly-hours">--</h3>
          <p class="mb-0">This Week</p>
        </div>
      </div>

      <!-- STUDY STREAK -->
      <div class="col-6">
        <div class="stat-card text-center p-3 rounded-3">
          <h3 id="study-streak">--</h3>
          <p class="mb-0">Current Streak</p>
        </div>
      </div>

      <!-- TOTAL HOURS -->
      <div class="col-6">
        <div class="stat-card text-center p-3 rounded-3">
          <h3 id="total-hours">--</h3>
          <p class="mb-0">Total Hours</p>
        </div>
      </div>


      <!-- LONGEST SESSION -->
      <div class="col-6">
        <div class="stat-card text-center p-3 rounded-3">
          <h3 id="longest-streak">--</h3>
          <p class="mb-0">Longest Streak</p>
        </div>
      </div>

    </section>


    <!-- RECENT STUDY SESSIONS -->
    <section class="recent-sessions mt-4">

      <h2 class="text-center fs-5 mb-4">
        Recent Sessions
      </h2>

      <div id="sessions-list">

        <div class="empty-sessions text-center p-4 rounded-3">
          <p class="mb-0">No study sessions yet.</p>
        </div>

      </div>

    </section>

  </main>


  <!-- BOTTOM NAVBAR -->
  <nav class="bottom-nav" aria-label="Main navigation">

    <!-- LEADERBOARD -->
    <a class="nav-item" href="/leaderboard">

      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z" />
        <path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3" />
      </svg>

      <span class="nav-label">Leaderboard</span>

    </a>


    <!-- PLAY -->
    <a class="nav-item nav-play" href="/study">

      <span class="play-circle">

        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 5v14l11-7z" />
        </svg>

      </span>

    </a>


    <!-- PROFILE -->
    <a class="nav-item" href="/profile" aria-current="page">

      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21a8 8 0 0 1 16 0" />
      </svg>

      <span class="nav-label">Profile</span>

    </a>

  </nav>


  <!-- ADD FRIEND POPUP -->
  <dialog class="friend-dialog" id="friend-dialog" aria-labelledby="friend-dialog-title">
    <form class="friend-form" id="friend-form">
      <button type="button" class="friend-close" id="friend-close" aria-label="Close">&times;</button>

      <h2 id="friend-dialog-title">Add a friend</h2>
      <p class="friend-hint">Enter their 5-character friend code (letters and numbers only).</p>

      <div class="field">
        <label for="friend-code">Friend code</label>
        <input type="text" id="friend-code" class="friend-code-input" name="code" placeholder="A1B2C"
          autocomplete="off" autocapitalize="characters" spellcheck="false" autofocus>
      </div>

      <p class="friend-error" id="friend-error" role="alert"></p>

      <button type="submit" class="friend-submit">Send request</button>
    </form>
  </dialog>


  <!-- ADD FRIEND JAVASCRIPT -->
  <script type="module" src="/js/addFriend.js"></script>

  <!-- FRIEND CODE ON PROFILE -->
  <script type="module" src="/js/profileFriendCode.js"></script>

  <!-- PROFILE JAVASCRIPT -->
  <script type="module" src="/js/profile.js"></script>

</body>

</html>
