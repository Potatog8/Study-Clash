<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Study Clash | Leaderboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/styles/navbar.css">
  <link rel="stylesheet" href="/styles/leaderboard.css">
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">
    <a class="header-brand" href="/leaderboard" aria-label="Study Clash home">

      <img src="/images/logostudy.png" alt="Study Clash Logo" class="site-logo">

      <span class="brand-name">Study Clash</span>
    </a>

    <div class="header-user">
      <span class="header-username" id="header-username"></span>
      <a class="header-login" id="logout-btn" href="/login">Log out</a>
    </div>
  </header>

  <!-- PAGE CONTENT -->
  <main class="page-content">
    <section class="leaderboard" aria-labelledby="leaderboard-title">
      <div class="leaderboard-head">
        <h1 id="leaderboard-title">Leaderboard</h1>
        <p class="leaderboard-sub">Who's put in the most study time this week</p>
      </div>

      <!-- Rows are filled in by leaderboard.js -->
      <ol class="leaderboard-list" id="leaderboard-list"></ol>
    </section>
  </main>

  <!-- BOTTOM NAVBAR -->
  <nav class="bottom-nav" aria-label="Main navigation">

    <a class="nav-item" href="/leaderboard" aria-current="page">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z" />
        <path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3" />
      </svg>
      <span class="nav-label">Leaderboard</span>
    </a>

    <a class="nav-item nav-play" href="/study">
      <span class="play-circle">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 5v14l11-7z" />
        </svg>
      </span>
    </a>

    <a class="nav-item" href="/profile">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21a8 8 0 0 1 16 0" />
      </svg>
      <span class="nav-label">Profile</span>
    </a>

  </nav>

  <script type="module" src="/js/leaderboard.js"></script>
</body>

</html>
